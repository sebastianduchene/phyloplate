<!DOCTYPE html>
<html>
<head>
  <title>Test Parser</title>
</head>
<body>
  <pre id="output"></pre>
  <script type="module">
    import { parseBeastXML } from './js/parse-beast.js';

    const out = (msg) => {
      document.getElementById('output').textContent += msg + '\n';
    };

    fetch('../varv_re_clock_prior.xml')
      .then(r => r.text())
      .then(xml => {
        try {
          const result = parseBeastXML(xml);
          out('Parsing successful!');
          out(`Found ${result.nodes.length} nodes`);
          out(`Found ${result.edges.length} edges`);
          out(`Found ${result.plates.length} plates`);

          // Find hyperparameter nodes
          const hypers = result.nodes.filter(n => n.isHyper);
          out(`\nHyperparameter nodes: ${hypers.length}`);

          hypers.slice(0, 30).forEach(h => {
            out(`  - ${h.label} (target: ${h.hyperTarget})`);
          });

          if (hypers.length > 30) {
            out(`  ... and ${hypers.length - 30} more`);
          }

          // Find all parameters with priors
          out(`\nParameters with priors:`);
          const withPriors = result.nodes.filter(n => n.priors && n.priors.length > 0);
          withPriors.forEach(n => {
            out(`  - ${n.id}: ${n.priors.length} prior(s) (${n.priors.map(p => p.label).join(', ')})`);
          });

          // List all nodes to see what's there
          out(`\n\nAll nodes (first 50):`);
          result.nodes.slice(0, 50).forEach(n => {
            out(`  ${n.id}: ${n.type}`);
          });
        } catch (e) {
          out('Error: ' + e.message + '\n' + e.stack);
        }
      })
      .catch(e => out('Fetch error: ' + e.message));
  </script>
</body>
</html>
